name: build-bottles

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [formulae.txt]

permissions:
  contents: write
  actions: write   # lets a run re-dispatch itself when work remains

concurrency:
  group: build-bottles
  cancel-in-progress: false

env:
  HOMEBREW_NO_ANALYTICS: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Mirror, build and publish bottles
        env:
          STOP_AFTER_MIN: "300"   # stop starting builds after 5h; next run resumes
        run: python3 scripts/sync.py
